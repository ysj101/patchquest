# 公開版（GitHub Pages）。main への push で dist/ をビルドし、静的ファイルとしてそのまま配信する。
# サーバー側の処理や外部APIはなく、ローカル配布物と同じ成果物を HTTPS で配るだけ（spec §12）。
# SQLite WASM はメモリ DB を module Worker で使うため COOP/COEP ヘッダは不要で、CSP は index.html の meta で指定している。
# PR の確認は ci.yml の E2E に任せ、ここでは PR ごとのプレビューは作らない。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同時に複数のデプロイを走らせない。進行中のデプロイは中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 演習用の機械（本物の Linux）の配布物と、その元になるもの（docs/machine-sources.md）。配布物を作るには機械を起動して状態を保存するので、
      # 作ったものを使い回す。鍵は配布物の中身を決めるもの（scripts/build-machine.mjs の inputsHash と同じ範囲）。古い配布物が戻っても、
      # ビルドが自分で比べて作り直す。元になるものは restore-keys で引き継ぐ
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .machine
          key: machine-${{ hashFiles('scripts/build-machine.mjs', 'scripts/cpio.mjs', 'scripts/machine-sources.mjs', 'apps/shell/linux/guest/**', 'pnpm-lock.yaml') }}
          restore-keys: machine-
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: デプロイ
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
