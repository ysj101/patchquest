# 重複コードの定期監査（止めない）。git blame 付きの HTML レポートを成果物に残し、全体を眺める。
# PR ごとの重複は ci.yml が止め、Code Scanning にも送る。
name: Duplication audit

on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 9:00（日本時間）
  workflow_dispatch:

jobs:
  audit:
    name: jscpd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --blame に履歴が要る
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:duplication
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jscpd-report
          path: report/
          retention-days: 30
