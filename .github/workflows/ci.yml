# CI。push（main）と PR ごとに、品質ゲート（pnpm run check：型・lint・重複・未使用コード・ユニットテストとカバレッジ）と
# ビルド（DOM 安全性・依存の境界・外部参照の検査を含む）、配布物の確認を行う。PR で走るのはこの 2 つだけ。
# Chrome の E2E とパックの出荷前検証は時間がかかるので、main へのマージ後（push）にだけ走らせる。本物の Linux を動かす「機械」を使う
# テストは CPU を使い切るので同じ機械の上では並べられない（Issue #173）。そこで別のランナーに分けて並べる：
# 通常の E2E・機械を使う E2E・パックごとの出荷前検証。出荷前検証はテストの一覧（パックごとに 1 件）から matrix を作るので、
# パックを足しても、このファイルを直さずに済む。
# マージ後のジョブが落ちたら、最後のジョブが Issue を作る（同じ印の開いた Issue があれば、コメントを足す）。
# 公開サイトは、マージ後のジョブがすべて通ったあとに pages.yml が配信する。
# 既存の lint 違反は eslint-suppressions.json に記録済みなので、ここで止まるのは新しく増えた問題だけ
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: PR の題名・本文を直したときもメールアドレス検査を再実行する
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# PR は同じ PR の古い実行を取り消す。main への push は取り消さない（続けてマージしても、途中のコミットの結果を残す）。
# main の実行を同じ group に入れると、待っている実行が新しいものに置き換わって捨てられるので、コミットごとに group を分ける
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: 品質ゲート・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # 重複コードを Code Scanning に送る
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # 重複の検査で origin/main と比べる
      - name: Check commit and PR email privacy
        env:
          # PR: base..head の全コミット。main への push: 直前の状態からの差分（初回 push は HEAD のみ）。
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || format('{0}^!', github.sha)) }}
          # 題名・本文は env 経由で渡す（スクリプトインジェクション対策）。
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-email-privacy.sh "$COMMIT_RANGE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 演習用の機械（本物の Linux）の配布物と、その元になるもの（docs/machine-sources.md）。配布物を作るには機械を起動して状態を保存するので、
      # 作ったものを使い回す。鍵は配布物の中身を決めるもの（scripts/build-machine.mjs の inputsHash と同じ範囲）。古い配布物が戻っても、
      # ビルドが自分で比べて作り直す。元になるものは restore-keys で引き継ぐ
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .machine
          key: machine-${{ hashFiles('scripts/build-machine.mjs', 'scripts/cpio.mjs', 'scripts/machine-sources.mjs', 'apps/shell/linux/guest/**', 'pnpm-lock.yaml') }}
          restore-keys: machine-
      # 重複コードを Code Scanning に送り、PR で増えた分を差分として表示する（止めるのは check の check:duplication）
      - run: pnpm exec jscpd --reporters sarif --silent
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: report/jscpd-report.sarif
          category: jscpd
      - run: pnpm run check
      - run: pnpm run build

  e2e:
    name: E2E（機械を使わないもの）
    if: github.event_name == 'push' # マージ後だけ
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chrome はランナーに入っているものを使う。機械の配布物はビルドが自分で用意する（このジョブでは機械を起動しない）
      # 演習用の機械（本物の Linux）の配布物と、その元になるもの（docs/machine-sources.md）。配布物を作るには機械を起動して状態を保存するので、
      # 作ったものを使い回す。鍵は配布物の中身を決めるもの（scripts/build-machine.mjs の inputsHash と同じ範囲）。古い配布物が戻っても、
      # ビルドが自分で比べて作り直す。元になるものは restore-keys で引き継ぐ
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .machine
          key: machine-${{ hashFiles('scripts/build-machine.mjs', 'scripts/cpio.mjs', 'scripts/machine-sources.mjs', 'apps/shell/linux/guest/**', 'pnpm-lock.yaml') }}
          restore-keys: machine-
      - run: node scripts/build.mjs --test
      - run: pnpm exec playwright test --project chrome --project chrome-quiet
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e
          path: test-results/
          retention-days: 7

  e2e-machine:
    name: E2E（機械を使うもの）
    if: github.event_name == 'push' # マージ後だけ
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 演習用の機械（本物の Linux）の配布物と、その元になるもの（docs/machine-sources.md）。配布物を作るには機械を起動して状態を保存するので、
      # 作ったものを使い回す。鍵は配布物の中身を決めるもの（scripts/build-machine.mjs の inputsHash と同じ範囲）。古い配布物が戻っても、
      # ビルドが自分で比べて作り直す。元になるものは restore-keys で引き継ぐ
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .machine
          key: machine-${{ hashFiles('scripts/build-machine.mjs', 'scripts/cpio.mjs', 'scripts/machine-sources.mjs', 'apps/shell/linux/guest/**', 'pnpm-lock.yaml') }}
          restore-keys: machine-
      - run: node scripts/build.mjs --test
      - run: pnpm exec playwright test --project chrome-machine
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e-machine
          path: test-results/
          retention-days: 7

  verify-plan:
    name: 出荷前検証の一覧
    if: github.event_name == 'push' # マージ後だけ
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # テストを実行せず、出荷前検証のテスト（パックごとに 1 件）の一覧から matrix を作る
      - id: matrix
        run: echo "matrix=$(node scripts/verify-packs-matrix.mjs)" >> "$GITHUB_OUTPUT"

  verify-packs:
    name: 出荷前検証（${{ matrix.title }}）
    needs: verify-plan
    if: github.event_name == 'push' # マージ後だけ
    runs-on: ubuntu-latest
    # 本物の Linux を動かす課題の出荷前検証は、機械の中でコマンドを実行する分だけ時間がかかる。テスト自体に時間の上限は置かず（tests/e2e/pack-verification.spec.ts）、固まったときはここで打ち切る
    timeout-minutes: 20
    strategy:
      fail-fast: false # 1 つのパックが落ちても、ほかのパックの結果は最後まで見る
      matrix: ${{ fromJSON(needs.verify-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 演習用の機械（本物の Linux）の配布物と、その元になるもの（docs/machine-sources.md）。配布物を作るには機械を起動して状態を保存するので、
      # 作ったものを使い回す。鍵は配布物の中身を決めるもの（scripts/build-machine.mjs の inputsHash と同じ範囲）。古い配布物が戻っても、
      # ビルドが自分で比べて作り直す。元になるものは restore-keys で引き継ぐ
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .machine
          key: machine-${{ hashFiles('scripts/build-machine.mjs', 'scripts/cpio.mjs', 'scripts/machine-sources.mjs', 'apps/shell/linux/guest/**', 'pnpm-lock.yaml') }}
          restore-keys: machine-
      # pnpm run verify:packs と同じ（ビルドして chrome-verify を走らせる）。このパックのテストだけに絞る
      - run: node scripts/build.mjs --test
      - run: pnpm exec playwright test --project chrome-verify --grep "$PACK_GREP"
        env:
          PACK_GREP: ${{ matrix.grep }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-verify-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  dist:
    name: 配布物の確認（Chrome）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 演習用の機械（本物の Linux）の配布物と、その元になるもの（docs/machine-sources.md）。配布物を作るには機械を起動して状態を保存するので、
      # 作ったものを使い回す。鍵は配布物の中身を決めるもの（scripts/build-machine.mjs の inputsHash と同じ範囲）。古い配布物が戻っても、
      # ビルドが自分で比べて作り直す。元になるものは restore-keys で引き継ぐ
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .machine
          key: machine-${{ hashFiles('scripts/build-machine.mjs', 'scripts/cpio.mjs', 'scripts/machine-sources.mjs', 'apps/shell/linux/guest/**', 'pnpm-lock.yaml') }}
          restore-keys: machine-
      - run: pnpm run test:dist
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-dist
          path: test-results/
          retention-days: 7

  # マージ後のジョブが落ちたときだけ、Issue で知らせる（取り消し・skip では作らない）。
  # 同じ失敗を何個も作らないよう、印（ラベル）の付いた開いている Issue があれば、コメントを足す
  notify-failure:
    name: 失敗の通知（Issue）
    needs: [e2e, e2e-machine, verify-plan, verify-packs]
    if: ${{ always() && github.event_name == 'push' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-failure-issue
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # 失敗したジョブの名前を読む
      pull-requests: read # コミットの PR を読む
      issues: write
    steps:
      # 外から来る文字列は env 経由で渡す（スクリプトインジェクション対策）。checkout はしない
      - name: Issue を作る、または既存の Issue にコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: ci-failure
        run: |
          set -euo pipefail
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name')
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then commit_line="コミット: $SHA（PR #$pr）"; else commit_line="コミット: $SHA"; fi
          {
            echo "main へのマージ後の検査（E2E・出荷前検証）が失敗した。"
            echo
            echo "失敗したジョブ:"
            echo "$failed"
            echo
            echo "$commit_line"
            echo "実行: $RUN_URL"
          } > body.md
          gh label create "$LABEL" --repo "$REPO" --color d73a4a --description "main へのマージ後の CI の失敗" --force
          existing=$(gh issue list --repo "$REPO" --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file body.md
          else
            gh issue create --repo "$REPO" --label "$LABEL" \
              --title "main へのマージ後の CI が失敗している" --body-file body.md
          fi
