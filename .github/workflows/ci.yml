# CI。push（main）と PR ごとに、品質ゲート（pnpm run check：型・lint・重複・未使用コード・ユニットテストとカバレッジ）と
# ビルド（DOM 安全性・依存の境界・外部参照の検査を含む）、E2E（Chrome。パックの出荷前検証を含む）・配布物の確認を行う。
# 既存の lint 違反は eslint-suppressions.json に記録済みなので、ここで止まるのは新しく増えた問題だけ
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: PR の題名・本文を直したときもメールアドレス検査を再実行する
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 品質ゲート・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # 重複コードを Code Scanning に送る
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # 重複の検査で origin/main と比べる
      - name: Check commit and PR email privacy
        env:
          # PR: base..head の全コミット。main への push: 直前の状態からの差分（初回 push は HEAD のみ）。
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || format('{0}^!', github.sha)) }}
          # 題名・本文は env 経由で渡す（スクリプトインジェクション対策）。
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-email-privacy.sh "$COMMIT_RANGE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 重複コードを Code Scanning に送り、PR で増えた分を差分として表示する（止めるのは check の check:duplication）
      - run: pnpm exec jscpd --reporters sarif --silent
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: report/jscpd-report.sarif
          category: jscpd
      - run: pnpm run check
      - run: pnpm run build

  browsers:
    name: E2E・出荷前検証・配布物（Chrome）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0（版は package.json の packageManager）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chrome はランナーに入っているものを使う
      - run: pnpm run test:e2e
      - run: pnpm run test:dist
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7
