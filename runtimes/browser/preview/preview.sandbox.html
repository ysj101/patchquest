<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- 自身のスクリプトと、検証済みペイロードのハンドラー pqMarker() だけをハッシュで許可する。通信はすべて禁止 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src {{SCRIPT_HASH}} 'unsafe-hashes' {{sha256:pqMarker()}}; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types default pq-inert"
    />
    <title>教材アプリ</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
        line-height: 1.6;
        --line: #d7d9de;
        --muted: #5b6270;
        --accent: #2457c5;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #fff;
        color: #1d2129;
      }
      h1, h2, h3 { line-height: 1.3; margin: 0 0 12px; }
      button, input, textarea, select { font: inherit; }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f6f7f9;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      input, textarea {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        width: 100%;
        box-sizing: border-box;
      }
      label { display: grid; gap: 4px; font-weight: 600; }
      .muted { color: var(--muted); }
      .error { color: #b3261e; }
      .error:empty { display: none; }
      .badge {
        display: inline-block;
        margin: 0 0 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #fff4d6;
        color: #6b4e00;
        font-size: 0.8rem;
      }
      button.link {
        border: none;
        background: none;
        padding: 2px 0;
        color: var(--accent);
        text-decoration: underline;
      }
      .memo-list { padding-left: 1.2em; }
      .memo { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
      .memo-body { white-space: pre-wrap; overflow-wrap: anywhere; }
      .comments { list-style: none; padding: 0; }
      .comment { border-bottom: 1px solid var(--line); padding: 8px 0; display: grid; gap: 2px; }
      .comment-body { white-space: pre-wrap; overflow-wrap: anywhere; }
      nav.row { margin-bottom: 8px; }
      .stack > * + * { margin-top: 12px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      /* メモ帳のログイントークン。3 つの部分を、色と下線の種類で見分けられるようにする */
      .token { display: block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.85rem; overflow-wrap: anywhere; background: #f6f7f9; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
      .token-header { color: #a3264b; text-decoration: underline dotted; }
      .token-payload { color: #6a3fb5; text-decoration: underline solid; }
      .token-signature { color: #0b6e8f; text-decoration: underline dashed; }
      .token-dot { font-weight: 700; padding: 0 2px; }
      .token-part { border-left: 3px solid var(--line); padding-left: 10px; }
      .token-part h4 { margin: 0 0 4px; }
      .token-part p { margin: 4px 0 0; }
      .token-part p code { font-size: 0.9rem; }
      .token-part textarea { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      /* 擬似シェルのターミナル */
      /* 端末は、プレビューの枠の高さいっぱいに広げる（32px は body の上下の余白）。出力の欄が伸び縮みし、入力欄は下の端に付く */
      .term-screen { display: flex; flex-direction: column; height: calc(100vh - 32px); min-height: 300px; }
      /* 札と「端末の使い方」。使い方を開くと、そのぶん端末が縮む */
      .term-head { flex: none; display: flex; flex-wrap: wrap; gap: 0 12px; align-items: baseline; }
      .term-head button.link { font-size: 0.85rem; margin: 0 0 8px; }
      .term-help { flex: 1 1 100%; margin: 0 0 8px; padding-left: 1.4em; font-size: 0.85rem; }
      /* 編集画面は、行が多くて枠に収まらないときに、枠ごと縦に送れるようにする（保存のボタンまで届く） */
      .term-screen.term-editing { height: auto; min-height: calc(100vh - 32px); }
      .terminal { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; border-radius: 8px; background: #14171c; color: #e6e9ef; font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'BIZ UDGothic', monospace; font-size: 0.9rem; }
      .term-output { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 12px 0; }
      .term-output pre { margin: 0 0 4px; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
      .term-line { color: #9fd3a8; }
      .term-err { color: #ffb4a8; }
      .term-note { color: #aab2c0; }
      /* 幅が足りないときは、プロンプトの下の行に入力欄を折り返す */
      .term-entry { flex: none; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 8px 12px 10px; font-weight: 400; }
      .term-prompt { color: #9fd3a8; white-space: nowrap; }
      .term-input { flex: 1 1 14em; width: auto; min-width: 0; border-color: #4a5160; background: #1d2129; color: inherit; font: inherit; }
      .term-output:focus-visible, .term-input:focus-visible, .term-button:focus-visible { outline-color: #8ab4ff; }
      .term-entry[hidden] { display: none; }
      .term-editor { flex: 1 1 auto; padding: 10px 12px; }
      .term-editor p { margin: 0 0 8px; }
      .term-edit-lines { margin: 0 0 8px; padding-left: 2.2em; color: #aab2c0; max-height: max(210px, calc(100vh - 310px)); overflow-y: auto; }
      .term-edit-lines li { margin: 0 0 4px; padding-left: 4px; }
      .term-edit-row { display: flex; gap: 4px; align-items: flex-start; }
      .term-edit-lines .term-input { flex: 1 1 auto; width: auto; min-width: 0; box-sizing: border-box; color: #e6e9ef; resize: none; overflow: hidden; overflow-wrap: anywhere; }
      .term-row-button { flex: none; padding: 2px 8px; }
      .term-edit-message:empty { display: none; }
      .term-editor .term-edit-message { white-space: pre-wrap; margin: 8px 0 0; }
      .term-edit-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .term-button { border: 1px solid #4a5160; border-radius: 6px; background: #2a303b; color: inherit; font: inherit; padding: 4px 10px; cursor: pointer; }
      .term-button:disabled { opacity: 0.6; cursor: default; }
    </style>
  </head>
  <body>
    <main id="app" class="stack"></main>
    <!--inline-script:preview.inline.ts-->
  </body>
</html>
